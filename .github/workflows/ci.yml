name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check application modules
        run: |
          for f in js/*.js server.mjs; do
            node --input-type=module --check < "$f" || exit 1
          done

      - name: Regenerate the sample document
        run: cd tools && npm ci && node make-sample.mjs

      - name: Install test dependencies
        run: cd test && npm ci

      - name: Search pipeline test
        run: cd test && node search.test.mjs

      - name: Engine test (real module, legacy PDF.js)
        run: cd test && node --import ./engine-hooks.mjs engine.test.mjs

      - name: App integration test (jsdom)
        run: cd test && node --import ./hooks.mjs app.test.mjs
